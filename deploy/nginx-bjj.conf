# Grace BJJ Kids — nginx site for the Debian host.
# Public: /, /coloring/, /login/, /img/, /fonts/, /sheets/, /css/splash.css, /coloring/*.
# Login required: /app/, /js/, /css/styles.css, /vendor/.
# The SQLite file lives in /var/lib/bjj-planner, which is not this root.

server {
    listen 80;
    server_name bjj.bettrbook.com;
    # Keep redirect Location headers relative (/login/) instead of http://bjj.bettrbook.com/login/.
    absolute_redirect off;
    root /srv/bjj-planner;
    index index.html;

    client_max_body_size 4m;

    # Block anything that looks like a database file, even if one is copied into the tree.
    location ~* \.(db|sqlite|sqlite3)$ {
        deny all;
        return 404;
    }
    location ^~ /var/ { deny all; return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location = /internal/auth {
        internal;
        proxy_pass http://127.0.0.1:8766/api/auth/nginx;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /app/ {
        auth_request /internal/auth;
        error_page 401 = @need_login;
        try_files $uri $uri/ /app/index.html;
    }

    location /js/ {
        auth_request /internal/auth;
        try_files $uri =404;
    }

    location = /css/styles.css {
        auth_request /internal/auth;
        try_files $uri =404;
    }

    location /vendor/ {
        auth_request /internal/auth;
        try_files $uri =404;
    }

    location @need_login {
        return 302 /login/;
    }

    location /coloring/ { try_files $uri $uri/ =404; }
    location /login/ { try_files $uri $uri/ =404; }
    location /img/ { try_files $uri =404; }
    location /fonts/ { try_files $uri =404; }
    location /sheets/ { try_files $uri =404; }
    location = /css/splash.css { try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
