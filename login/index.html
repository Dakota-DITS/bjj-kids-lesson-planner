<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teacher login · Grace BJJ Kids</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#9b2a12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Grace BJJ Kids" />
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
  <link rel="stylesheet" href="/css/splash.css?v=20261021-12" />
  <script src="/pwa.js?v=20261021-12" defer></script>
  <style>
    form.login {
      max-width: 420px;
      margin: 24px auto 40px;
      background: #fff;
      border-radius: 18px;
      padding: 20px 18px 24px;
      box-shadow: 0 10px 30px rgba(20, 17, 15, 0.08);
    }
    label { display: block; font-size: 0.95rem; margin: 12px 0 4px; }
    input {
      width: 100%;
      font: inherit;
      font-size: 16px;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #111;
      min-height: 48px;
    }
    button.big { border: 0; width: 100%; cursor: pointer; margin-top: 16px; }
    button.big:disabled { opacity: 0.7; }
    .error { color: #9b2a12; min-height: 1.4em; font-weight: 700; }
    .login-links { text-align: center; }
    .login-links a { display: inline-flex; align-items: center; min-height: 44px; padding: 8px; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <img class="logo" src="/img/logo/grace-logo-mark-transparent.png" alt="Grace Jiu Jitsu" />
      <h1>Teacher login</h1>
      <p class="welcome">For teachers and admins. Parents can head back to the coloring sheets.</p>
    </header>
    <form class="login" id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <p class="error" id="error" role="alert"></p>
      <button class="big" type="submit">Log in</button>
    </form>
    <p class="login-links"><a href="/">Back to the welcome page</a> · <a href="/coloring/">Coloring sheets</a></p>
  </main>
  <script>
    const form = document.getElementById("loginForm");
    const error = document.getElementById("error");
    const submit = form.querySelector("button.big");
    let pending = false;
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (pending) return;
      pending = true;
      submit.disabled = true;
      error.textContent = "";
      try {
        const pre = await fetch("/api/auth/csrf", { credentials: "same-origin" });
        const csrfBody = await pre.json();
        const res = await fetch("/api/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfBody.csrf },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          error.textContent = data.error || "Could not log in.";
          return;
        }
        window.location.href = "/app/";
      } catch (err) {
        error.textContent = "The attendance server is not reachable from this page.";
      } finally {
        pending = false;
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
